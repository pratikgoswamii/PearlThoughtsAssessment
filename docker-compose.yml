version: '3.8'
services:
  php:
    image: pratiikgoswamii/yii2-php:8.3-apache
    environment:
      - VIRTUAL_HOST=13.200.215.199
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    volumes:
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
      - ./:/app:delegated
    ports:
      - '8000:80'
